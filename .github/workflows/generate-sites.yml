name: Generate & deploy demo sites

on:
  push:
    branches: [main]
    paths: ['leads/leads.json', '.github/workflows/generate-sites.yml']
  workflow_dispatch:

concurrency:
  group: generate-sites
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install template deps
        run: npm ci
        working-directory: template

      - name: Find pending leads
        id: pending
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('leads/leads.json','utf8')).filter(l=>!l.demo_url).length)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT lead(s) pending"

      - name: Build pending sites
        if: steps.pending.outputs.count != '0'
        run: node scripts/generate-site.mjs --all

      # ---- Deploy (skipped until CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      # ---- secrets are added; token needs Cloudflare Pages:Edit).
      # ---- Optional DEMO_DOMAIN secret (e.g. "usawebsitedude.com"): when set, each
      # ---- site is also attached as <slug>.DEMO_DOMAIN and that becomes the
      # ---- demo URL; until then demo URLs are sd-<slug>.pages.dev.
      - name: Deploy to Cloudflare Pages
        if: steps.pending.outputs.count != '0' && secrets.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_DOMAIN: ${{ secrets.DEMO_DOMAIN }}
        run: node scripts/deploy-pending.mjs

      - name: Write demo URLs back to leads.json
        if: steps.pending.outputs.count != '0' && secrets.CLOUDFLARE_API_TOKEN != ''
        run: |
          if git diff --quiet leads/leads.json; then
            echo "no demo URLs to record"; exit 0
          fi
          git config user.name "site-dude-bot"
          git config user.email "bot@sitedude.com"
          git add leads/leads.json
          git commit -m "record demo URLs [bot]"
          git push
