name: Generate & deploy demo sites

on:
  push:
    branches: [main]
    paths: ['leads/leads.json', '.github/workflows/generate-sites.yml']
  workflow_dispatch:

concurrency:
  group: generate-sites
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # secrets are mapped to job env because the `secrets` context is not
    # allowed inside step-level `if:` expressions
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEMO_DOMAIN: ${{ secrets.DEMO_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Install template deps
        run: npm ci
        working-directory: template

      - name: Find pending leads
        id: pending
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('leads/leads.json','utf8')).filter(l=>!l.demo_url).length)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT lead(s) pending"

      - name: Build pending sites
        if: steps.pending.outputs.count != '0'
        run: |
          echo "== build ==" >> /tmp/ci.log
          node scripts/generate-site.mjs --all 2>&1 | tee -a /tmp/ci.log
          exit ${PIPESTATUS[0]}

      # ---- Deploy (skipped until CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      # ---- secrets are added; token needs Cloudflare Pages:Edit).
      # ---- Optional DEMO_DOMAIN secret (e.g. "usawebsitedude.com"): when set, each
      # ---- site is also attached as <slug>.DEMO_DOMAIN and that becomes the
      # ---- demo URL; until then demo URLs are sd-<slug>.pages.dev.
      - name: Deploy to Cloudflare Pages
        if: steps.pending.outputs.count != '0' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          echo "== deploy ==" >> /tmp/ci.log
          node scripts/deploy-pending.mjs 2>&1 | tee -a /tmp/ci.log
          exit ${PIPESTATUS[0]}

      - name: Write demo URLs back to leads.json
        if: steps.pending.outputs.count != '0' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if git diff --quiet leads/leads.json; then
            echo "no demo URLs to record"; exit 0
          fi
          git config user.name "site-dude-bot"
          git config user.email "bot@usawebsitedude.com"
          git add leads/leads.json
          git commit -m "record demo URLs [bot]"
          git push

      # on failure, commit the captured log so it can be read without
      # GitHub UI access (removed once the pipeline is stable)
      - name: Report failure log back to repo
        if: failure()
        run: |
          mkdir -p .ci
          { echo "run $GITHUB_RUN_ID failed at $(date -u '+%F %T') UTC"
            tail -150 /tmp/ci.log 2>/dev/null || echo "(no step log captured — failure was before build/deploy)"
          } > .ci/last-failure.log
          git config user.name "site-dude-bot"
          git config user.email "bot@usawebsitedude.com"
          git add .ci/last-failure.log
          git commit -m "ci failure log [bot] [skip ci]"
          git push
